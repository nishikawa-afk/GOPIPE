# F-16 自治体別 給水装置工事申込 様式テンプレ
#
# ProjectInfo.municipality をキーに、様式名・提出先・提出方法・必要書類・留意点を
# 出し分ける。aliases で表記ゆれ（「千葉広域水道企業団」等）を吸収。
# 未知の自治体は default を使う。
#
# ※ 正確な様式・必要書類は各事業者の最新版に従うこと。本テンプレは申込ドラフトの
#   骨子（共通項目＋自治体差分）を自動で埋めるためのもの。

municipalities:
  - name: 東京都水道局
    aliases: [東京都, 都水道, 東水]
    form_name: 給水装置工事申込書
    authority: 東京都水道局
    submit: 給水装置工事電子申請システム（来庁不要のオンライン提出が可能）
    documents:
      - 給水装置工事設計書
      - 平面図・配管図（系統図）
      - 位置図・案内図
      - 給水用具・器具リスト
      - 給水装置工事主任技術者の指定
    notes: 電子申請システムでオンライン申請が可能。指定給水装置工事事業者の指定は東京都水道局。

  - name: 市原市
    aliases: [市原, 市原市水道部, 市原市上下水道]
    form_name: 給水装置工事申込書（市原市）
    authority: 市原市水道部
    submit: 市原市 上下水道 窓口へ提出（電子化状況は要確認）
    documents:
      - 給水装置工事申込書
      - 給水装置工事設計図書（平面図・配管図）
      - 位置図
      - 指定給水装置工事事業者の確認
      - 給水装置工事主任技術者の指定
    notes: >-
      市原市の給水区域が対象。市原市内でも千葉県営水道の給水区域は千葉県企業局が窓口に
      なるため、着手前に給水区域（市営／県営）の確認が必要。

  - name: 千葉県営水道
    aliases: [千葉広域水道企業団, 千葉県広域水道企業団, 千葉県企業局, 千葉県水道局, 千葉県営水道（企業局）, 千葉]
    form_name: 給水装置工事申込書（千葉県営水道）
    authority: 千葉県企業局（千葉県営水道）
    submit: 管轄の水道事務所 総務課へ提出（様式は千葉県HPで PDF/Word 配布）
    documents:
      - 給水装置工事申込書
      - 給水装置工事設計書
      - 平面図・立面図（配管図）
      - 給水に係る事前協議申請書（必要時）
      - 給水装置工事検査申込
    notes: >-
      指定給水装置工事事業者の指定は千葉県企業局。給水装置工事施行基準（令和3年4月適用）に準拠。
      「千葉県広域水道企業団」は用水供給（卸売）事業者で一部末端給水も行うが、給水装置工事の
      申込窓口は千葉県企業局（県営水道）。

default:
  form_name: 給水装置工事申込書
  authority: （提出先の水道事業者）
  submit: （各自治体の窓口／電子申請システム）
  documents:
    - 給水装置工事申込書
    - 給水装置工事設計書（平面図・配管図）
    - 位置図・案内図
    - 給水装置工事主任技術者の指定
  notes: 汎用様式。提出先自治体の最新様式・必要書類・電子申請の可否を確認すること。
