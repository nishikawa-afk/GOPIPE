# GOPIPE 配管・設備工事 単価マスタ（拾い出し → 見積ドラフト連携）
#
# 1 エントリ = 1 行の単価ルール。spec / category / name / vendor_id のうち
# 「埋めたキー全部」が item と一致したときマッチし、specificity が高い順に採用。
#   specificity: vendor_id=8 / spec=4 / category=2 / name=1
#
# unit_price     : 円 / unit（税抜・材工込みの社内目安）  ★必須
# material_ratio : 0..1。材料比率（発注書の材工按分に使う）
#
# ※ 二系統運用（自社見積単価 / 公共公表単価＋標準歩掛）は、将来 vendor_id を
#   "self" / "public" のように使い分けて上書きする想定。MVP は自社単価のみ。
# ※ 価格はあくまで初期の仮値。実勢・自社基準で更新する。

prices:
