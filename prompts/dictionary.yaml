# GOPIPE 配管・設備工事 品目辞書（拾い出し用）
#
# canonical: 正規名称（Excel/集計で使う表記）。lookup では完全一致＋3文字以上の部分一致で当たる。
# category : 系統・工種カテゴリ（給水/給湯/排水/通気/消火/ガス/冷媒/ドレン/
#            弁類/継手/衛生器具/機器/ダクト/保温/支持金物/はつり・復旧/試験調整/雑材）
# unit     : 標準単位（配管=m、継手/弁=個、器具/機器=台、ダクト=m2 など）
# aliases  : canonical 以外の別名のみ（canonical 自身は書かない）。3 文字以上で部分一致する。

entries:
  # ========================= 配管（系統別） =========================
  - canonical: 給水管
    category: 給水
    unit: m
    aliases: [水道用ライニング鋼管, 硬質塩ビライニング鋼管, 水道用硬質塩化ビニル管]

  - canonical: 給湯管
    category: 給湯
    unit: m
    aliases: [被覆銅管, 架橋ポリエチレン管, ポリブテン管]

  - canonical: 排水管
    category: 排水
    unit: m
    aliases: [硬質塩ビ排水管, 排水用鋳鉄管, 耐火二層管]

  - canonical: 通気管
    category: 通気
    unit: m
    aliases: [伸頂通気管, ループ通気管]

  - canonical: 消火管
    category: 消火
    unit: m
    aliases: [スプリンクラー配管, 屋内消火栓配管, 連結送水管]

  - canonical: ガス管
    category: ガス
    unit: m
    aliases: [ガス配管, 白ガス管, ガス用ポリエチレン管]

  - canonical: 冷媒管
    category: 冷媒
    unit: m
    aliases: [ペアコイル, 冷媒用銅管, 被覆冷媒銅管]

  - canonical: ドレン管
    category: ドレン
    unit: m
    aliases: [ドレン配管, 結露ドレン]

  # ========================= 弁類・継手 =========================
  # ⚠️ ここは「別の部材」を1つに畳まないこと。逆止弁とバタフライ弁は品物も単価も違う。
  #    alias に書いてよいのは同一部材の表記ゆれ（ゲートバルブ＝仕切弁）だけ。
  #    別部材を alias にすると、AIが正しく読んだ名前を classify が握り潰し、
  #    表に同じ名前が並んで「二重計上の疑い」まで誤爆する。
  - canonical: 仕切弁
    category: 弁類
    unit: 個
    aliases: [ゲートバルブ, ゲート弁, 仕切り弁]

  - canonical: 玉形弁
    category: 弁類
    unit: 個
    aliases: [グローブバルブ, グローブ弁, 玉型弁]

  - canonical: ボール弁
    category: 弁類
    unit: 個
    aliases: [ボールバルブ, ボール型弁]

  - canonical: バタフライ弁
    category: 弁類
    unit: 個
    aliases: [バタフライバルブ, バタ弁, 蝶形弁]

  - canonical: 逆止弁
    category: 弁類
    unit: 個
    aliases: [チャッキ弁, チェッキ弁, チェックバルブ, 逆止め弁]

  - canonical: 止水栓
    category: 弁類
    unit: 個
    aliases: [ストップ弁, 止水バルブ]

  - canonical: 減圧弁
    category: 弁類
    unit: 個
    aliases: [減圧バルブ, 定水位弁]

  - canonical: エルボ
    category: 継手
    unit: 個
    aliases: [エルボー, 曲がり継手]

  - canonical: チーズ
    category: 継手
    unit: 個
    aliases: [ティー継手, T継手]

  - canonical: ソケット
    category: 継手
    unit: 個
    aliases: [ソケット継手, カップリング]

  - canonical: ニップル
    category: 継手
    unit: 個
    aliases: [ニップル継手]

  - canonical: レジューサ
    category: 継手
    unit: 個
    aliases: [レデューサ, 径違いソケット, 異径ソケット]

  - canonical: フランジ
    category: 継手
    unit: 個
    aliases: [フランジ継手, フランジ接合]

  # 種類まで読み取れなかったときの受け皿。個別の継手が先に一致するので、
  # ここへ落ちるのは「継手」とだけ書かれていた行。
  - canonical: 継手
    category: 継手
    unit: 個
    aliases: [管継手, 異径継手]

